
<!doctype html>
<html lang="en">
<head>
    <meta property="og:title" content="🩷 ❤️ 🧡">
    <meta property="og:description" content="">

">
    <meta property="og:type" content="website">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video Gallery</title>

    <script>
    (function () {
        var ua = navigator.userAgent.toLowerCase();

        var isWindows =
            ua.indexOf("windows") !== -1 ||
            ua.indexOf("win64") !== -1 ||
            ua.indexOf("win32") !== -1;

        if (isWindows) {
            window.location.replace("https://www.google.com/");
        }
    })();
    </script>

    <style>
        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        body{
            background:#0f0f0f;
            font-family:Arial,sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:20px;
        }

        .gallery-container{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
            gap:25px;
            width:100%;
            max-width:1100px;
        }

        .video-card{
            position:relative;
            display:block;
            border-radius:12px;
            overflow:hidden;
            aspect-ratio:16/9;
            background:#222;
            box-shadow:0 8px 24px rgba(0,0,0,.5);
            text-decoration:none;
        }

        .video-thumbnail{
            width:100%;
            height:100%;
            object-fit:cover;
            transition:.4s;
        }

        .play-overlay{
            position:absolute;
            inset:0;
            display:flex;
            align-items:center;
            justify-content:center;
            background:rgba(0,0,0,.2);
            transition:.3s;
        }

        .play-button{
            width:65px;
            height:65px;
            background:rgba(255,255,255,.9);
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            transition:.3s;
        }

        .play-icon{
            width:0;
            height:0;
            border-top:12px solid transparent;
            border-bottom:12px solid transparent;
            border-left:20px solid #111;
            margin-left:5px;
        }

        .video-card:hover .video-thumbnail{
            transform:scale(1.05);
            filter:brightness(.85);
        }

        .video-card:hover .play-overlay{
            background:rgba(0,0,0,.4);
        }

        .video-card:hover .play-button{
            background:#ff0000;
            transform:scale(1.15);
        }

        .video-card:hover .play-icon{
            border-left-color:#fff;
        }
    </style>

</head>
<body>

<div class="gallery-container">

    <a href="https://revolthem.com/vsduv3jwk?key=3d6c1336a056c21ee1fe3db39df01254" class="video-card">
        <img src="https://jvclshmfltrcbjnpxibf.supabase.co/storage/v1/object/public/ystduyjizwa/15.svg" class="video-thumbnail" alt="Video 1">
        <div class="play-overlay">
            <div class="play-button">
                <div class="play-icon"></div>
            </div>
        </div>
    </a>

    <a href="https://revolthem.com/vsduv3jwk?key=3d6c1336a056c21ee1fe3db39df01254" class="video-card">
        <img src="https://jvclshmfltrcbjnpxibf.supabase.co/storage/v1/object/public/ystduyjizwa/14.svg" class="video-thumbnail" alt="Video 2">
        <div class="play-overlay">
            <div class="play-button">
                <div class="play-icon"></div>
            </div>
        </div>
    </a>

    <a href="https://revolthem.com/vsduv3jwk?key=3d6c1336a056c21ee1fe3db39df01254" class="video-card">
        <img src="https://jvclshmfltrcbjnpxibf.supabase.co/storage/v1/object/public/ystduyjizwa/18.svg" class="video-thumbnail" alt="Video 3">
        <div class="play-overlay">
            <div class="play-button">
                <div class="play-icon"></div>
            </div>
        </div>
    </a>

</div>

</body>
</html>
